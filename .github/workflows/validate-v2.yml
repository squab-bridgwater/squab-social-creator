name: Validate V2 source

on:
  push:
    branches:
      - dev/v2-source-rebuild
  pull_request:
    branches:
      - dev/source-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck V2 source
        run: npm run typecheck
      - name: Build V2 source
        run: npm run build
